<title>Mekong Growth 2026 – Official Program</title>
<style>
  :root {
    --navy: #0B1F3B;
    --navy2: #1A3560;
    --navy3: #0D2A52;
    --gold: #D4AF37;
    --gold2: #B8962E;
    --cream: #F7F4EE;
    --white: #ffffff;
    --muted: #6A8BAA;
    --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI','Noto Sans Thai','Phetsarath OT',Arial,sans-serif; background: var(--cream); color: var(--navy); }

  /* ── LANG BAR ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--navy);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem;
    border-bottom: 3px solid var(--gold);
  }
  .topbar-logo { font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; }
  .lang-btns { display: flex; gap: 6px; padding: 10px 0; }
  .lang-btn {
    padding: 5px 16px; border: 1.5px solid var(--gold);
    background: transparent; color: var(--gold);
    border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .2s;
  }
  .lang-btn.active, .lang-btn:hover { background: var(--gold); color: var(--navy); }

  /* ── HERO ── */
  .hero { background: var(--navy); padding: 3rem 1.5rem 2.5rem; text-align: center; position: relative; }
  .hero::after { content:''; position:absolute; bottom:0; left:0; right:0; height:4px; background:var(--gold); }
  .hero-badge {
    display: inline-block; background: var(--gold); color: var(--navy);
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    padding: 5px 18px; border-radius: 20px; margin-bottom: 1.1rem;
  }
  .hero h1 {
    font-size: clamp(1.7rem, 5vw, 3rem); font-weight: 700; color: var(--white);
    letter-spacing: 2px; line-height: 1.15; margin-bottom: .5rem;
  }
  .hero .tagline { font-size: clamp(.9rem,2.5vw,1.15rem); font-style: italic; color: var(--gold); margin-bottom: .6rem; }
  .hero .theme {
    font-size: clamp(.8rem,1.8vw,.95rem); color: rgba(170,188,208,.85);
    max-width: 680px; margin: 0 auto 2rem; line-height: 1.6;
  }
  .hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 2rem; }
  .hero-pill {
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(212,175,55,.35);
    border-radius: 30px; padding: 7px 16px; color: #AABCD0; font-size: 13px;
  }
  .hero-pill b { color: var(--gold); }

  /* Day badges */
  .day-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 760px; margin: 0 auto; }
  .day-badge {
    background: var(--navy3); border: 1.5px solid var(--gold);
    border-radius: 10px; padding: 12px 16px; min-width: 110px;
    text-align: center; flex: 1 1 100px; max-width: 150px;
  }
  .day-badge .db-num { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: 2px; }
  .day-badge .db-date { color: var(--white); font-size: 13px; font-weight: 600; margin-top: 3px; }
  .day-badge .db-label { color: rgba(170,188,208,.7); font-size: 10px; margin-top: 2px; line-height: 1.3; }

  /* ── MAIN ── */
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 1rem 3rem; }

  .sec-title {
    font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
    color: var(--gold2); text-align: center; margin: 2.5rem 0 1rem;
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 2.5rem; }
  .stat { background: var(--navy); border-radius: var(--r); padding: 16px 10px; text-align: center; }
  .stat .sv { font-size: 1.6rem; font-weight: 700; color: var(--gold); }
  .stat .sl { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

  /* ── DAY BLOCK ── */
  .day-block { margin-bottom: 2rem; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 18px rgba(11,31,59,.12); }
  .day-hdr {
    padding: 1.2rem 1.5rem;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .day-hdr-left .dn { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--gold); margin-bottom: 4px; }
  .day-hdr-left h2 { font-size: 1.05rem; font-weight: 700; color: var(--white); line-height: 1.3; }
  .day-hdr-left .dd { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 3px; }
  .day-hdr-icon { font-size: 1.8rem; opacity: .65; flex-shrink: 0; margin-top: 2px; }

  /* Sessions */
  .sessions { background: var(--white); }
  .sess {
    display: flex; align-items: stretch;
    border-bottom: 1px solid #ede9e0;
  }
  .sess:last-child { border-bottom: none; }
  .sess-time {
    width: 128px; min-width: 128px; padding: 16px 10px;
    display: flex; align-items: flex-start; justify-content: center;
    flex-shrink: 0;
  }
  .sess-time span {
    font-size: 10px; font-weight: 700; color: var(--white);
    border-radius: 6px; padding: 5px 8px; text-align: center;
    line-height: 1.5; display: block;
  }
  .sess-body { flex: 1; padding: 14px 16px 14px 10px; }
  .sess-body h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 7px; }
  .sess-body ul { padding-left: 16px; }
  .sess-body li { font-size: 12.5px; color: #4a5568; margin-bottom: 3px; line-height: 1.55; }

  /* Participants */
  .part-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px,1fr)); gap: 10px; }
  .part-card {
    background: var(--navy); border: 1px solid rgba(212,175,55,.28);
    border-radius: var(--r); padding: 18px 10px; text-align: center;
  }
  .part-card .pi { font-size: 1.4rem; margin-bottom: 8px; }
  .part-card .pl { font-size: 12px; font-weight: 600; color: var(--white); line-height: 1.4; }

  footer {
    background: var(--navy); color: var(--muted);
    text-align: center; padding: 1.5rem;
    font-size: 12px; border-top: 3px solid var(--gold);
  }
  footer a { color: var(--gold); text-decoration: none; }

  @media(max-width:560px){
    .sess { flex-direction: column; }
    .sess-time { width: auto; min-width: unset; justify-content: flex-start; padding: 12px 16px 4px; }
  }
</style>

function render(lang) {
  const d = DATA[lang];

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  // Hero
  document.getElementById('h-badge').textContent   = d.badge;
  document.getElementById('h-tagline').textContent = d.tagline;
  document.getElementById('h-theme').textContent   = d.theme;

  // Day badges
  const badges = document.getElementById('dayBadges');
  badges.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    badges.innerHTML += `
      <div class="day-badge">
        <div class="db-num">${d.dayLabels[i]}</div>
        <div class="db-date">${d.dayDates[i]}</div>
        <div class="db-label">${d.dayShort[i]}</div>
      </div>`;
  }

  // Section titles
  document.getElementById('glanceTitle').textContent = d.glance;
  document.getElementById('partTitle').textContent   = d.partTitle;

  // Stats
  const sg = document.getElementById('statsGrid');
  sg.innerHTML = d.stats.map(s =>
    `<div class="stat"><div class="sv">${s.v}</div><div class="sl">${s.l}</div></div>`
  ).join('');

  // Day blocks
  const db = document.getElementById('dayBlocks');
  db.innerHTML = '';
  d.days.forEach((day, i) => {
    const col = DAY_COLORS[i];
    const ico = DAY_ICONS[i];
    const sessHTML = day.sessions.map(s => {
      const lis = s.bullets.map(b => `<li>${b}</li>`).join('');
      return `
        <div class="sess">
          <div class="sess-time">
            <span style="background:${col}">${s.time}</span>
          </div>
          <div class="sess-body">
            <h3 style="color:${col}">${s.title}</h3>
            ${lis ? `<ul>${lis}</ul>` : ''}
          </div>
        </div>`;
    }).join('');

    db.innerHTML += `
      <div class="day-block">
        <div class="day-hdr" style="background:${col}">
          <div class="day-hdr-left">
            <div class="dn">${d.dayLabels[i]}</div>
            <h2>${day.title}</h2>
            <div class="dd">${day.date}</div>
          </div>
          <div class="day-hdr-icon">${ico}</div>
        </div>
        <div class="sessions">${sessHTML}</div>
      </div>`;
  });

  // Participants
  const pg = document.getElementById('partGrid');
  pg.innerHTML = d.participants.map(p =>
    `<div class="part-card"><div class="pi">${p.i}</div><div class="pl">${p.l}</div></div>`
  ).join('');
}

document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => render(b.dataset.lang));
});

render('en');
</script>
