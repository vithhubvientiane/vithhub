<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mekong Growth Expo 2026 — 15-Day Checklist</title>
<style>
  :root {
    --bg: #0d0f12;
    --surface: #161920;
    --surface2: #1e222b;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f2f5;
    --muted: #7a8394;
    --muted2: #555d6e;
    --gold: #e8b84b;
    --gold-dim: rgba(232,184,75,0.12);
    --red: #e05252;
    --red-dim: rgba(224,82,82,0.1);
    --blue: #4d9de0;
    --blue-dim: rgba(77,157,224,0.1);
    --green: #3dbf7f;
    --green-dim: rgba(61,191,127,0.1);
    --amber: #f0a04a;
    --amber-dim: rgba(240,160,74,0.1);
    --teal: #35c4b0;
    --teal-dim: rgba(53,196,176,0.1);
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* TOP HEADER */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    gap: 12px;
  }
  .logo-block { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    flex-shrink: 0;
  }
  .logo-text { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: .02em; }
  .logo-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .live-badge {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--green);
    background: var(--green-dim);
    border: 1px solid rgba(61,191,127,0.2);
    padding: 3px 9px; border-radius: 20px;
  }
  .live-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--green);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .sync-btn {
    background: none; border: 1px solid var(--border2);
    color: var(--muted); font-size: 12px; padding: 4px 10px;
    border-radius: var(--radius-sm); cursor: pointer; transition: all .15s;
  }
  .sync-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

  /* MAIN */
  .main { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }

  /* HERO */
  .hero { margin-bottom: 24px; }
  .hero-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .1em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 8px;
  }
  .hero-title { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2; margin-bottom: 4px; }
  .hero-sub { font-size: 13px; color: var(--muted); }

  /* PROGRESS */
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .progress-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 10px; }
  .progress-pct { font-size: 32px; font-weight: 700; color: var(--gold); line-height: 1; }
  .progress-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .progress-count { font-size: 13px; color: var(--muted); }
  .progress-bar-bg {
    height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--gold); border-radius: 3px;
    transition: width .4s ease; width: 0%;
  }
  .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .stat-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    border: 1px solid; display: flex; align-items: center; gap: 4px;
  }
  .stat-pill.red { color: var(--red); border-color: rgba(224,82,82,0.25); background: var(--red-dim); }
  .stat-pill.blue { color: var(--blue); border-color: rgba(77,157,224,0.25); background: var(--blue-dim); }
  .stat-pill.green { color: var(--green); border-color: rgba(61,191,127,0.25); background: var(--green-dim); }
  .stat-pill.amber { color: var(--amber); border-color: rgba(240,160,74,0.25); background: var(--amber-dim); }
  .stat-pill.teal { color: var(--teal); border-color: rgba(53,196,176,0.25); background: var(--teal-dim); }
  .stat-num { font-weight: 600; }

  /* FILTERS */
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .f-btn {
    font-size: 12px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: none;
    color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .f-btn:hover { color: var(--text); border-color: var(--border2); }
  .f-btn.active { color: var(--gold); border-color: rgba(232,184,75,0.4); background: var(--gold-dim); }

  /* DAY SECTIONS */
  .day-block { margin-bottom: 8px; }
  .day-header {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer; transition: border-color .15s, background .15s;
    user-select: none;
  }
  .day-header:hover { border-color: var(--border2); background: var(--surface2); }
  .day-block.open .day-header {
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom-color: transparent;
    background: var(--surface2);
  }
  .day-num-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(224,82,82,0.25); }
  .badge-amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,160,74,0.25); }
  .badge-blue { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(77,157,224,0.25); }
  .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(61,191,127,0.25); }
  .day-title { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
  .day-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .day-prog-text { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .day-prog-mini {
    width: 36px; height: 3px; background: var(--surface2);
    border-radius: 2px; overflow: hidden; flex-shrink: 0;
  }
  .day-prog-mini-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .3s; }
  .chevron-icon {
    font-size: 11px; color: var(--muted2); flex-shrink: 0;
    transition: transform .2s;
  }
  .day-block.open .chevron-icon { transform: rotate(180deg); }

  .task-list {
    display: none;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }
  .day-block.open .task-list { display: block; }

  .task-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .1s;
  }
  .task-item:last-child { border-bottom: none; }
  .task-item:hover { background: var(--surface2); }
  .task-item.done { opacity: .45; }

  .task-cb {
    width: 17px; height: 17px; border-radius: 4px;
    border: 1.5px solid var(--border2);
    flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .task-item.done .task-cb {
    background: var(--green); border-color: var(--green);
  }
  .task-cb svg { display: none; }
  .task-item.done .task-cb svg { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-text { font-size: 13px; color: var(--text); line-height: 1.45; }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted2); }
  .task-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag {
    font-size: 10px; padding: 1px 7px; border-radius: 20px; font-weight: 500;
  }
  .tag-crit { background: var(--red-dim); color: var(--red); }
  .tag-tech { background: var(--blue-dim); color: var(--blue); }
  .tag-ops { background: var(--teal-dim); color: var(--teal); }
  .tag-vip { background: var(--amber-dim); color: var(--amber); }
  .tag-mkt { background: rgba(180,100,220,0.12); color: #c084fc; }

  .who-badge {
    font-size: 10px; padding: 1px 7px; border-radius: 20px;
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border);
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); font-size: 12px; padding: 8px 16px;
    border-radius: 20px; opacity: 0; transition: all .25s; pointer-events: none;
    z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* SYNC STATUS */
  .sync-status {
    font-size: 11px; color: var(--muted2); text-align: center;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
  }

  @media (max-width: 480px) {
    .main { padding: 16px 12px 60px; }
    .hero-title { font-size: 18px; }
    .day-date { display: none; }
    .progress-pct { font-size: 26px; }
  }
</style>
</head>

</main>

const STORAGE_KEY = 'mg2026_done_v2';
let filter = 'all';
let doneSet = new Set();
let lastSyncTime = null;

async function loadFromStorage() {
  try {
    const result = await window.storage.get(STORAGE_KEY, true);
    if (result && result.value) {
      const arr = JSON.parse(result.value);
      doneSet = new Set(arr);
    }
  } catch(e) {
    try {
      const local = localStorage.getItem(STORAGE_KEY);
      if (local) doneSet = new Set(JSON.parse(local));
    } catch(e2) {}
  }
  lastSyncTime = new Date();
  updateSyncStatus();
}

async function saveToStorage() {
  const arr = [...doneSet];
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(arr), true);
  } catch(e) {}
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch(e) {}
  lastSyncTime = new Date();
  updateSyncStatus();
}

function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!lastSyncTime) { el.textContent = 'กำลังโหลด...'; return; }
  const t = lastSyncTime.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  el.textContent = `ซิงค์ล่าสุด ${t} · ข้อมูลแชร์ร่วมกันทุกคน`;
}

async function syncNow() {
  showToast('กำลังซิงค์...');
  await loadFromStorage();
  renderDays();
  showToast('ซิงค์แล้ว ✓');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderDays();
}

function toggleTask(dayId, taskIdx) {
  const key = dayId + '|' + taskIdx;
  if (doneSet.has(key)) doneSet.delete(key);
  else doneSet.add(key);
  saveToStorage();
  const el = document.querySelector(`[data-key="${key}"]`);
  if (el) {
    el.classList.toggle('done', doneSet.has(key));
  }
  updateProgress();
  updateDayBar(dayId);
}

function updateProgress() {
  let total = 0, done = 0;
  let crit = 0, tech = 0, ops = 0, vip = 0, mkt = 0;
  DAYS.forEach(d => d.tasks.forEach((t, i) => {
    const vis = filter === 'all' || t.tags.includes(filter);
    if (!vis) return;
    total++;
    if (doneSet.has(d.id + '|' + i)) done++;
    if (t.tags.includes('crit')) crit++;
    if (t.tags.includes('tech')) tech++;
    if (t.tags.includes('ops')) ops++;
    if (t.tags.includes('vip')) vip++;
    if (t.tags.includes('mkt')) mkt++;
  }));
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('count-text').textContent = done + ' / ' + total + ' งาน';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('cnt-crit').textContent = crit;
  document.getElementById('cnt-tech').textContent = tech;
  document.getElementById('cnt-ops').textContent = ops;
  document.getElementById('cnt-vip').textContent = vip;
  document.getElementById('cnt-mkt').textContent = mkt;

  const today = new Date();
  const target = new Date('2026-06-25');
  const diff = Math.ceil((target - today) / 86400000);
  document.getElementById('days-left').textContent = diff > 0 ? `เหลืออีก ${diff} วัน` : 'วันงาน!';
}

function updateDayBar(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return;
  const visTasks = day.tasks.filter(t => filter === 'all' || t.tags.includes(filter));
  let done = 0;
  visTasks.forEach((t, i) => {
    const origIdx = day.tasks.indexOf(t);
    if (doneSet.has(dayId + '|' + origIdx)) done++;
  });
  const pct = visTasks.length ? Math.round(done / visTasks.length * 100) : 0;
  const fill = document.querySelector(`[data-dayfill="${dayId}"]`);
  const prog = document.querySelector(`[data-dayprog="${dayId}"]`);
  if (fill) fill.style.width = pct + '%';
  if (prog) prog.textContent = done + '/' + visTasks.length;
}

function tagHtml(tags) {
  const map = { crit: ['tag-crit','Critical'], tech: ['tag-tech','Tech'], ops: ['tag-ops','Ops'], vip: ['tag-vip','VIP'], mkt: ['tag-mkt','Marketing'] };
  return tags.map(t => map[t] ? `<span class="tag ${map[t][0]}">${map[t][1]}</span>` : '').join('');
}

function renderDays() {
  const container = document.getElementById('days-container');
  const openStates = {};
  document.querySelectorAll('.day-block').forEach(el => {
    openStates[el.dataset.dayid] = el.classList.contains('open');
  });
  container.innerHTML = '';

  DAYS.forEach(day => {
    const visTasks = day.tasks.filter(t => filter === 'all' || t.tags.includes(filter));
    if (visTasks.length === 0) return;

    let doneCount = 0;
    visTasks.forEach(t => { const i = day.tasks.indexOf(t); if (doneSet.has(day.id + '|' + i)) doneCount++; });
    const pct = Math.round(doneCount / visTasks.length * 100);
    const isOpen = openStates[day.id] !== undefined ? openStates[day.id] : (day.id === 'd15');

    const block = document.createElement('div');
    block.className = 'day-block' + (isOpen ? ' open' : '');
    block.dataset.dayid = day.id;

    block.innerHTML = `
      <div class="day-header" onclick="this.closest('.day-block').classList.toggle('open')">
        <span class="day-num-badge ${day.bc}">${day.badge}</span>
        <span class="day-title">${day.name}</span>
        <span class="day-date">${day.date}</span>
        <span class="day-prog-text" data-dayprog="${day.id}">${doneCount}/${visTasks.length}</span>
        <div class="day-prog-mini"><div class="day-prog-mini-fill" data-dayfill="${day.id}" style="width:${pct}%"></div></div>
        <span class="chevron-icon">▾</span>
      </div>
      <div class="task-list">
        ${visTasks.map(t => {
          const origIdx = day.tasks.indexOf(t);
          const key = day.id + '|' + origIdx;
          const isDone = doneSet.has(key);
          return `<div class="task-item${isDone ? ' done' : ''}" data-key="${key}" onclick="toggleTask('${day.id}',${origIdx})">
            <div class="task-cb">
              <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
                <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="task-body">
              <div class="task-text">${t.t}</div>
              <div class="task-meta">${tagHtml(t.tags)}<span class="who-badge">${t.who}</span></div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    container.appendChild(block);
  });
  updateProgress();
}

(async () => {
  await loadFromStorage();
  renderDays();
  setInterval(async () => {
    await loadFromStorage();
    renderDays();
  }, 30000);
})();
</script>
